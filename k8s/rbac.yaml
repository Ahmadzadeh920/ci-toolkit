# Example RBAC for a self-hosted runner / service account that will run
# reusable-deploy-kubernetes.yml or reusable-deploy-helm.yml against a
# namespace. Scope this to the minimum verbs and resources your deployment
# actually needs — this is a starting point, not a template to apply as-is.

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-deployer
  namespace: my-namespace
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deployer
  namespace: my-namespace
subjects:
  - kind: ServiceAccount
    name: github-actions
    namespace: my-namespace
roleRef:
  kind: Role
  name: github-actions-deployer
  apiGroup: rbac.authorization.k8s.io
