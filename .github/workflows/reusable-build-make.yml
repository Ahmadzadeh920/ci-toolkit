name: Reusable Build (Make / Artifact)

# Implements the shared build interface documented in docs/build-interface.md
# for repositories that don't produce a container image at all (a compiled
# binary, a static site bundle, a jar), plus an optional path for wrapping
# the result in a thin runtime image when the caller wants one. Matches the
# scope of reusable-docker-build.yml: local build only, no registry contact,
# no secrets. Pushing a wrapped image is reusable-docker-push.yml's job.

on:
  workflow_call:
    inputs:
      ##########################################################
      # Runner
      ##########################################################
      runner:
        description: GitHub runner
        required: false
        type: string
        default: ubuntu-latest

      ##########################################################
      # Build Configuration
      ##########################################################
      working-directory:
        description: Directory the build command runs in
        required: false
        type: string
        default: .

      build-command:
        description: Shell command that produces the build output
        required: false
        type: string
        default: make build

      output-path:
        description: Path (file or directory, relative to working-directory) containing the build result
        required: true
        type: string

      ##########################################################
      # Optional image wrapping
      ##########################################################
      wrap-in-image:
        description: If true, build a runtime image around output-path using wrapper-dockerfile
        required: false
        type: boolean
        default: false

      wrapper-dockerfile:
        description: Dockerfile used to build the runtime image when wrap-in-image is true
        required: false
        type: string
        default: Dockerfile

      image-name:
        description: Local Docker image name. Required if wrap-in-image is true
        required: false
        type: string
        default: ""

      image-tag:
        description: Docker image tag. Used only if wrap-in-image is true
        required: false
        type: string
        default: latest

      ##########################################################
      # Artifact
      ##########################################################
      save-artifact:
        description: Save the build result as a workflow artifact
        required: false
        type: boolean
        default: true

      artifact-name:
        description: Artifact name
        required: false
        type: string
        default: build-output

      ##########################################################
      # Job
      ##########################################################
      timeout-minutes:
        description: Job timeout
        required: false
        type: number
        default: 30

    outputs:
      image-name:
        description: Docker image name. Empty string if wrap-in-image is false
        value: ${{ jobs.build.outputs.image-name }}
      image-tag:
        description: Docker image tag. Empty string if wrap-in-image is false
        value: ${{ jobs.build.outputs.image-tag }}
      image:
        description: Full local image. Empty string if wrap-in-image is false
        value: ${{ jobs.build.outputs.image }}
      artifact-name:
        description: Build artifact name
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: Make / Artifact Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      image-name: ${{ inputs.wrap-in-image && inputs.image-name || '' }}
      image-tag: ${{ inputs.wrap-in-image && inputs.image-tag || '' }}
      image: ${{ inputs.wrap-in-image && format('{0}:{1}', inputs.image-name, inputs.image-tag) || '' }}
      artifact-name: ${{ inputs.artifact-name }}
    steps:
      ##########################################################
      # Checkout
      ##########################################################
      - name: Checkout source
        uses: actions/checkout@v4

      ##########################################################
      # Guard: wrap-in-image requires image-name
      ##########################################################
      - name: Validate inputs
        if: inputs.wrap-in-image
        run: |
          if [ -z "${{ inputs.image-name }}" ]; then
            echo "::error::image-name is required when wrap-in-image is true." >&2
            exit 1
          fi

      ##########################################################
      # Run build command
      ##########################################################
      - name: Run build command
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}

      ##########################################################
      # Verify build output
      ##########################################################
      - name: Verify build output
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ ! -e "${{ inputs.output-path }}" ]; then
            echo "::error::output-path '${{ inputs.output-path }}' was not produced by build-command." >&2
            exit 1
          fi

      ##########################################################
      # Upload raw artifact (non-image path)
      ##########################################################
      - name: Upload build artifact
        if: inputs.save-artifact && !inputs.wrap-in-image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.output-path }}
          retention-days: 7
          if-no-files-found: error

      ##########################################################
      # Optional wrap-in-image path
      ##########################################################
      - name: Set up QEMU
        if: inputs.wrap-in-image
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: inputs.wrap-in-image
        uses: docker/setup-buildx-action@v3

      - name: Build wrapper image
        if: inputs.wrap-in-image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.working-directory }}
          file: ${{ inputs.wrapper-dockerfile }}
          push: false
          load: true
          tags: ${{ inputs.image-name }}:${{ inputs.image-tag }}

      - name: Verify wrapper image
        if: inputs.wrap-in-image
        run: |
          docker image inspect \
            ${{ inputs.image-name }}:${{ inputs.image-tag }}

      - name: Export wrapper image
        if: inputs.wrap-in-image && inputs.save-artifact
        run: |
          docker save \
            ${{ inputs.image-name }}:${{ inputs.image-tag }} \
            -o image.tar

      - name: Upload wrapper image artifact
        if: inputs.wrap-in-image && inputs.save-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: image.tar
          retention-days: 7
          if-no-files-found: error

      ##########################################################
      # Build Summary
      ##########################################################
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Make / Artifact Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Runner | ${{ inputs.runner }} |"
            echo "| Build command | ${{ inputs.build-command }} |"
            echo "| Output path | ${{ inputs.output-path }} |"
            echo "| Wrapped in image | ${{ inputs.wrap-in-image }} |"
            echo "| Image | ${{ inputs.wrap-in-image && format('{0}:{1}', inputs.image-name, inputs.image-tag) || 'n/a' }} |"
            echo "| Artifact | ${{ inputs.artifact-name }} |"
          } >> "$GITHUB_STEP_SUMMARY"
