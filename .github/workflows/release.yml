name: Release

on:
  push:
    tags:
      # Full semver only. This deliberately does NOT match the floating
      # `v1` major alias, so force-moving `v1` on every patch release
      # doesn't retrigger this workflow.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # need full history so CHANGELOG.md is complete

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [ ! -f CHANGELOG.md ]; then
            echo "No CHANGELOG.md in repo root, will auto-generate notes." >&2
            echo "generate_notes=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pull everything between "## [VERSION]" and the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG.md section found for $VERSION, will auto-generate notes." >&2
            echo "generate_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "generate_notes=false" >> "$GITHUB_OUTPUT"
          fi

      # Two separate steps (rather than one with a conditional `body_path`)
      # because action inputs don't support a clean "or null" expression.
      - name: Create GitHub Release (from CHANGELOG)
        if: steps.changelog.outputs.generate_notes == 'false'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Create GitHub Release (auto-generated notes)
        if: steps.changelog.outputs.generate_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
