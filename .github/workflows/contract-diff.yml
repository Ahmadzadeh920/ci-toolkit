name: Contract Diff Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    paths:
      - '.github/workflows/**.yml'
      - '.github/scripts/contract_diff.py'

permissions:
  contents: read
  pull-requests: read

jobs:
  # Finds every reusable workflow (any file under .github/workflows/ that
  # declares `workflow_call:`) so we never have to hand-maintain a list.
  # Adding a 12th reusable workflow next month requires editing zero CI files.
  discover:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.find.outputs.files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Find reusable workflows
        id: find
        run: |
          FILES=$(grep -l 'workflow_call:' .github/workflows/*.yml 2>/dev/null \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          FILES="${FILES:-[]}"
          echo "files=$FILES" >> "$GITHUB_OUTPUT"
          echo "Discovered reusable workflows: $FILES"

  # One parameterized job, run once per discovered file via matrix.
  contract-diff:
    needs: discover
    if: needs.discover.outputs.files != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # a break in file #3 shouldn't hide results for files #4-11
      matrix:
        file: ${{ fromJson(needs.discover.outputs.files) }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find last released tag
        id: last_tag
        run: |
          LAST_TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$LAST_TAG" ]; then
            echo "No prior release tag found -- nothing to diff against (first release)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Comparing ${{ matrix.file }} against $LAST_TAG"
            echo "tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.last_tag.outputs.skip == 'false'
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.last_tag.outputs.skip == 'false'
        run: pip install pyyaml

      - name: Extract old workflow_call contract
        if: steps.last_tag.outputs.skip == 'false'
        run: |
          # If the file didn't exist yet at the last release tag, this is a
          # brand-new reusable workflow -- treat "old" as an empty contract
          # so nothing looks "removed", only "added" (non-breaking).
          git show ${{ steps.last_tag.outputs.tag }}:${{ matrix.file }} > old_workflow.yml 2>/dev/null \
            || echo "on: {}" > old_workflow.yml

      - name: Diff workflow_call contract
        id: diff
        if: steps.last_tag.outputs.skip == 'false'
        run: |
          python .github/scripts/contract_diff.py \
            --old old_workflow.yml \
            --new "${{ matrix.file }}" \
            | tee contract_diff_report.txt

          if grep -qE "^(REMOVED|RENAMED)" contract_diff_report.txt; then
            echo "breaking=true" >> "$GITHUB_OUTPUT"
          else
            echo "breaking=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enforce breaking-change acknowledgement
        if: steps.diff.outputs.breaking == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          echo "File:      ${{ matrix.file }}"
          echo "PR title:  $PR_TITLE"
          echo "PR labels: $PR_LABELS"

          if echo "$PR_LABELS" | grep -qi 'breaking-change'; then
            echo "Acknowledged via 'breaking-change' label. Passing."
          elif echo "$PR_TITLE" | grep -qiE '(^[a-z]+(\([^)]*\))?!:|breaking[ -]?change)'; then
            echo "Acknowledged via PR title (conventional-commit '!' or 'breaking change'). Passing."
          else
            echo "::error::${{ matrix.file }} removes or renames a workflow_call input, secret, or output vs. ${{ steps.last_tag.outputs.tag }}. That's a breaking change for existing callers. Either restore backward compatibility, or add the 'breaking-change' label (or a conventional-commit '!' in the title) and plan a major version bump."
            exit 1
          fi

  # Single required check for branch protection, regardless of how many
  # reusable workflows exist. Point "Require status checks" at THIS job only.
  gate:
    needs: [discover, contract-diff]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate matrix results
        run: |
          RESULT="${{ needs.contract-diff.result }}"
          echo "contract-diff result: $RESULT"
          if [ "$RESULT" == "failure" ]; then
            echo "::error::One or more reusable workflow contracts broke compatibility without acknowledgement."
            exit 1
          fi
          echo "All reusable workflow contracts OK (or none changed in this PR)."