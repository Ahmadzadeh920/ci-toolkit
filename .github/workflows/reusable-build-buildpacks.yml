name: Reusable Build (Cloud Native Buildpacks)

# Implements the shared build interface documented in
# docs/build-interface.md. This is the Buildpacks-based alternative to
# reusable-docker-build.yml: no Dockerfile is read, the image is derived
# directly from the source tree using a builder image. Scope matches
# reusable-docker-build.yml exactly — this workflow builds locally and
# optionally saves a tar artifact. It never contacts a registry and holds
# no secrets; pushing is reusable-docker-push.yml's job.

on:
  workflow_call:
    inputs:
      ##########################################################
      # Runner
      ##########################################################
      runner:
        description: GitHub runner
        required: false
        type: string
        default: ubuntu-latest

      ##########################################################
      # Build Configuration
      ##########################################################
      working-directory:
        description: Path to the application source to build
        required: false
        type: string
        default: .

      builder-image:
        description: Cloud Native Buildpacks builder image
        required: false
        type: string
        default: paketobuildpacks/builder-jammy-base:latest

      image-name:
        description: Local Docker image name
        required: true
        type: string

      image-tag:
        description: Docker image tag
        required: false
        type: string
        default: latest

      ##########################################################
      # Build Options
      ##########################################################
      buildpacks:
        description: Optional comma-separated list of specific buildpack references to force. Leave empty to auto-detect.
        required: false
        type: string
        default: ""

      env-vars:
        description: Multiline KEY=VALUE pairs passed to the build via `pack build --env`
        required: false
        type: string
        default: ""

      clear-cache:
        description: Clear the builder's cache before building
        required: false
        type: boolean
        default: false

      trust-builder:
        description: Trust the builder image (required by most community builders)
        required: false
        type: boolean
        default: true

      ##########################################################
      # Artifact
      ##########################################################
      save-artifact:
        description: Save image as tar artifact
        required: false
        type: boolean
        default: true

      artifact-name:
        description: Artifact name
        required: false
        type: string
        default: buildpacks-image

      ##########################################################
      # Job
      ##########################################################
      timeout-minutes:
        description: Job timeout
        required: false
        type: number
        default: 30

    outputs:
      image-name:
        description: Docker image name
        value: ${{ jobs.build.outputs.image-name }}
      image-tag:
        description: Docker image tag
        value: ${{ jobs.build.outputs.image-tag }}
      image:
        description: Full local image
        value: ${{ jobs.build.outputs.image }}
      artifact-name:
        description: Buildpacks artifact
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    name: Buildpacks Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      image-name: ${{ inputs.image-name }}
      image-tag: ${{ inputs.image-tag }}
      image: ${{ inputs.image-name }}:${{ inputs.image-tag }}
      artifact-name: ${{ inputs.artifact-name }}
    steps:
      ##########################################################
      # Checkout
      ##########################################################
      - name: Checkout source
        uses: actions/checkout@v4

      ##########################################################
      # Setup pack CLI
      ##########################################################
      - name: Set up pack CLI
        uses: buildpacks/github-actions/setup-pack@v5.9.2

      ##########################################################
      # Build Image
      ##########################################################
      - name: Build Buildpacks Image
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail

          ARGS=(build "${{ inputs.image-name }}:${{ inputs.image-tag }}" \
            --builder "${{ inputs.builder-image }}")

          if [ "${{ inputs.trust-builder }}" = "true" ]; then
            ARGS+=(--trust-builder)
          fi

          if [ "${{ inputs.clear-cache }}" = "true" ]; then
            ARGS+=(--clear-cache)
          fi

          if [ -n "${{ inputs.buildpacks }}" ]; then
            IFS=',' read -ra BP_LIST <<< "${{ inputs.buildpacks }}"
            for bp in "${BP_LIST[@]}"; do
              ARGS+=(--buildpack "$bp")
            done
          fi

          if [ -n "${{ inputs.env-vars }}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              ARGS+=(--env "$line")
            done <<< "${{ inputs.env-vars }}"
          fi

          pack "${ARGS[@]}"

      ##########################################################
      # Verify Image
      ##########################################################
      - name: Verify Buildpacks Image
        run: |
          docker image inspect \
            ${{ inputs.image-name }}:${{ inputs.image-tag }}

      ##########################################################
      # Save Image
      ##########################################################
      - name: Export Buildpacks Image
        if: inputs.save-artifact
        run: |
          docker save \
            ${{ inputs.image-name }}:${{ inputs.image-tag }} \
            -o image.tar

      ##########################################################
      # Upload Artifact
      ##########################################################
      - name: Upload Buildpacks Artifact
        if: inputs.save-artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: image.tar
          retention-days: 7
          if-no-files-found: error

      ##########################################################
      # Build Summary
      ##########################################################
      - name: Buildpacks Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Buildpacks Build Summary"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| Runner | ${{ inputs.runner }} |"
            echo "| Image | ${{ inputs.image-name }} |"
            echo "| Tag | ${{ inputs.image-tag }} |"
            echo "| Builder | ${{ inputs.builder-image }} |"
            echo "| Working directory | ${{ inputs.working-directory }} |"
            echo "| Artifact | ${{ inputs.artifact-name }} |"
          } >> "$GITHUB_STEP_SUMMARY"
